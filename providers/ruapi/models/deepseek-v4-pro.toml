# Prices from https://www.ruapi.ai/pricing (standard rate), checked 2026-10-23. USD per 1M tokens.
# Reasoning tokens are billed at the output rate.
# `deepseek-v4-pro` serves DeepSeek V4 Pro 0813, as on DeepSeek's own API (providers/deepseek/models/deepseek-v4-pro.toml).
# OpenAI-compatible POST https://www.ruapi.ai/v1/chat/completions; thinking and reasoning_effort are
# forwarded unchanged, reasoning comes back in reasoning_content; prompt caching is automatic.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
cache = { implicit = true }

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.584
cache = { read = 0.06 }

[cost.text.output]
price = 4.752
reasoning = 4.752
